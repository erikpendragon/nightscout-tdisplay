  - id: fetch_thresholds
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            std::string u = id(ns_url).state;
            while (!u.empty() && u.back() == '/') u.pop_back();
            u += "/api/v1/status.json";
            const std::string &tk = id(ns_token).state;
            if (!tk.empty())
              u += (u.find('?') == std::string::npos ? "?token=" : "&token=") + tk;
            return u;
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - lambda: |-
                  // A 401/403 here IS the answer: this instance refuses
                  // anonymous reads, so a read-only token is required.
                  if (response->status_code == 401 || response->status_code == 403) {
                    id(ts_token_req).publish_state("YES - this Nightscout refuses anonymous reads");
                    return;
                  }
                  if (response->status_code != 200) return;
                  JsonDocument doc;
                  if (deserializeJson(doc, body)) {
                    ESP_LOGW("cgm", "status parse failed");
                    return;
                  }
                  const char *roles = doc["settings"]["authDefaultRoles"] | "";
                  if (strstr(roles, "readable") != nullptr)
                    id(ts_token_req).publish_state("No - this Nightscout allows anonymous reads");
                  else if (*roles)
                    id(ts_token_req).publish_state("YES - roles are \"" + std::string(roles) + "\"");
                  if (!id(sw_ns_th).state) return;
                  JsonObject th = doc["settings"]["thresholds"];
                  if (th.isNull()) return;
                  // Nightscout always stores these in mg/dL, whatever
                  // DISPLAY_UNITS says. Convert only if we render mmol/L.
                  bool mg = id(g_mgdl);
                  float f = mg ? 1.0f : 18.0182f;
                  // The spinner ranges follow the units Nightscout is actually
                  // reporting, so there is no compile-time mg/dL vs mmol/L
                  // choice to get wrong. Nightscout is the source of truth for
                  // both the values and the scale they are on.
                  struct M { const char *key; esphome::number::Number *n;
                             float lo_mg, hi_mg, lo_mm, hi_mm; };
                  M m[4] = {
                    { "bgLow",          id(n_urgent_low),  40, 110, 2.0f,  6.0f },
                    { "bgTargetBottom", id(n_low),         45, 125, 2.5f,  7.0f },
                    { "bgTargetTop",    id(n_high),       110, 250, 6.0f, 16.0f },
                    { "bgHigh",         id(n_urgent_high),150, 400, 8.0f, 25.0f },
                  };
                  bool any = false;
                  for (int i = 0; i < 4; i++) {
                    m[i].n->traits.set_min_value(mg ? m[i].lo_mg : m[i].lo_mm);
                    m[i].n->traits.set_max_value(mg ? m[i].hi_mg : m[i].hi_mm);
                    m[i].n->traits.set_step(mg ? 1.0f : 0.1f);
                    if (!th[m[i].key].is<float>()) continue;
                    float v = th[m[i].key].as<float>() / f;
                    if (!(v > 0)) continue;
                    // publish only - never control() - so the manual values
                    // stay in flash and come back if the switch is turned off
                    if (fabsf(m[i].n->state - v) > 0.001f) m[i].n->publish_state(v);
                    any = true;
                  }
                  if (any && !id(g_th_from_ns)) {
                    ESP_LOGI("cgm", "thresholds adopted from Nightscout: %.1f/%.1f/%.1f/%.1f",
                             id(n_urgent_low).state, id(n_low).state,
                             id(n_high).state, id(n_urgent_high).state);
                  }
                  id(g_th_from_ns) = any;

interval:
  # One scheduler tick driving every fetch.
  #
  # Two separate `interval:` blocks looked simpler but had two faults. They
  # have no phase offset, so a 60s and a 300s timer coincide every fifth
  # cycle and fire overlapping http_request scripts - the thing that wedges
  # this board. And polling the detail group at 300s against data that
  # arrives every ~300s means the two periods beat against each other: the
  # phases drift, so it self-corrects, but the worst case is a full extra
  # cycle of latency for something that is already sitting in Nightscout.
  #
  # Nightscout does the slow, jittery work of pulling from Dexcom and Glooko.
  # A LAN request to Nightscout costs 155 bytes, so the display should add
  # nothing measurable to the latency budget.
  #
  # At most ONE fetch runs per tick, so two can never overlap. Whatever is
  # skipped is simply first in line next tick - with the periods below the
  # scheduler is about a third subscribed, so nothing starves.
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = millis();
          // Signed difference, so the 49-day millis() rollover is a non-event
          // - same discipline as the reading-age maths.
          auto due = [&](uint32_t &slot, uint32_t period_ms) -> bool {
            if ((int32_t)(now - slot) < 0) return false;
            slot = now + period_ms;
            return true;
          };
          // Ordered by how much the freshness matters. A 24h TIR does not
          // move in five minutes; a bolus you just entered does.
          if      (due(id(g_due_bg),      30000)) id(fetch_bg)->execute();
          else if (due(id(g_due_tx),      60000)) id(fetch_tx)->execute();
          else if (due(id(g_due_hist),   120000)) id(fetch_hist)->execute();
          else if (due(id(g_due_ages),   300000)) id(fetch_ages)->execute();
          else if (due(id(g_due_alarms), 300000)) id(fetch_alarms)->execute();
          else if (due(id(g_due_stats),  900000)) id(fetch_stats)->execute();
          else if (due(id(g_due_thresh),1800000)) id(fetch_thresholds)->execute();

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO35
      inverted: true
    id: btn_top
    name: "Top Button"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 6
    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: btn_bottom
            then:
              - script.execute: flip_screen
            else:
              - lambda: 'id(g_page) = (id(g_page) + 1) % (id(g_stale) ? 8 : 7);'
              - script.execute: page_timeout
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    id: btn_bottom
    name: "Bottom Button"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 7
    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: btn_top
            then:
              - script.execute: flip_screen
            else:
              - lambda: 'id(g_page) = (id(g_page) + (id(g_stale) ? 7 : 6)) % (id(g_stale) ? 8 : 7);'
              - script.execute: page_timeout

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 2
    update_interval: 60s
  - platform: uptime
    id: dev_uptime
    name: "Uptime"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 3
  - platform: debug
    free:
      name: "Heap Free"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 4
      id: heap_free
    fragmentation:
      name: "Heap Fragmentation"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 5

debug:
  update_interval: 60s

# Wipes everything the device has learned: wifi credentials, the Nightscout
# URL and token, and all sixteen stored settings. The board comes back up as
# the "CGM Display Setup" access point, exactly as it left the factory.
#
# Use it before handing the board to somebody else. A configured device holds
# your wifi password in flash, and flash can be read back over USB.
button:
  # The update entity polls every 6 hours. This asks now - useful right after
  # a release, and the only way to re-check without power-cycling.
  - platform: template
    name: "Check for Updates"
    web_server:
      sorting_group_id: grp_upd
      sorting_weight: 4
    on_press:
      - if:
          condition:
            lambda: 'return id(g_upd_off);'
          then:
            - lambda: |-
                id(ts_upd_status).publish_state("Updates disabled - set a manifest URL to re-enable");
          else:
            - lambda: |-
                id(ts_upd_status).publish_state("Checking...");
                id(fw_update).check();
            # Held so the "Checking..." is actually visible - the fetch itself can
            # come back faster than anyone can read it.
            - delay: 4s
            - lambda: |-
                const std::string &lv = id(fw_update).update_info.latest_version;
                switch (id(fw_update).state) {
                  case update::UPDATE_STATE_AVAILABLE:
                    // The component only checks that the strings differ, so a
                    // manifest naming an OLDER build also reads as "available".
                    // Say which it is rather than calling a downgrade an update.
                    if (version_is_newer(lv, ESPHOME_PROJECT_VERSION))
                      id(ts_upd_status).publish_state("Update available: " + lv);
                    else
                      id(ts_upd_status).publish_state(
                        "Manifest offers " + lv + " - older than the " +
                        ESPHOME_PROJECT_VERSION + " installed");
                    break;
                  case update::UPDATE_STATE_NO_UPDATE:
                    id(ts_upd_status).publish_state("Up to date");
                    break;
                  case update::UPDATE_STATE_INSTALLING:
                    id(ts_upd_status).publish_state("Installing...");
                    break;
                  default:
                    id(ts_upd_status).publish_state("Check failed - could not reach the manifest");
                }

  # Checking and installing are deliberately separate: nothing downloads or
  # reboots until you ask for it. A press with no update waiting does nothing -
  # perform() returns unless the state is AVAILABLE.
  - platform: template
    name: "Install Update"
    web_server:
      sorting_group_id: grp_upd
      sorting_weight: 5
    on_press:
      # perform(bool) hides the base class's no-arg overload, so it has to be
      # called with the force flag. false = only act when an update is waiting.
      - lambda: |-
          if (id(g_upd_off)) {
            id(ts_upd_status).publish_state("Updates disabled - set a manifest URL to re-enable");
            return;
          }
          id(fw_update).perform(false);

  - platform: factory_reset
    name: "Factory Reset"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 9

switch:
  # With this on, the four thresholds below are pulled from Nightscout's own
  # settings every 5 minutes and the manual values are ignored. One source of
  # truth beats two that can silently disagree.
  - platform: template
    name: "Use Nightscout Thresholds"
    web_server:
      sorting_group_id: grp_ns
      sorting_weight: 3
    id: sw_ns_th
    optimistic: true
    # On for a device that has never been set up, and whatever you last chose
    # after that - restore_mode only supplies the default when there is no
    # stored value. It does not re-decide on every boot.
    #
    # Safe to have on, because adopting thresholds only publish_state()s them.
    # The values you typed stay in flash and come back the moment you turn
    # this off.
    restore_mode: RESTORE_DEFAULT_ON
  # The two buttons pressed together do the same thing - this is here so the
  # setting is discoverable on the web page rather than folded knowledge.
  # On Omnipod the reservoir sits inside the pod: both are replaced in the
  # same action, and Glooko emits the two events back to back with sequential
  # guids. A separate row then says nothing new and costs a third of the page.
  # Tubed pumps (Tandem, Medtronic) change the cartridge and the infusion site
  # independently - turn this on for those.
  - platform: template
    name: "Separate Reservoir"
    web_server:
      sorting_group_id: grp_wear
      sorting_weight: 5
    id: sw_sep_res
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Flip Screen"
    web_server:
      sorting_group_id: grp_disp
      sorting_weight: 4
    id: sw_flip
    lambda: 'return id(g_flip);'
    turn_on_action:
      - lambda: |-
          id(g_flip) = true;
          id(disp).set_rotation(DISPLAY_ROTATION_270_DEGREES);
    turn_off_action:
      - lambda: |-
          id(g_flip) = false;
          id(disp).set_rotation(DISPLAY_ROTATION_90_DEGREES);

text_sensor:
  # What is actually running. The update entity knows, but does not surface it
  # anywhere you would look for it.
  - platform: template
    name: "Installed Version"
    id: ts_fw_version
    web_server:
      sorting_group_id: grp_upd
      sorting_weight: 1
    update_interval: never

  # A check takes a second or two and otherwise gives no sign it happened.
  # This says "checking", holds long enough to be read, then reports.
  - platform: template
    name: "Update Status"
    id: ts_upd_status
    web_server:
      sorting_group_id: grp_upd
      sorting_weight: 2
    update_interval: never

  # Whether a token is needed is a property of the Nightscout you point at, not
  # a preference - so report it rather than making people guess.
  - platform: template
    name: "Token needed?"
    id: ts_token_req
    web_server:
      sorting_group_id: grp_ns
      sorting_weight: 3
    update_interval: never

  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
      web_server:
        sorting_group_id: grp_diag
        sorting_weight: 1

