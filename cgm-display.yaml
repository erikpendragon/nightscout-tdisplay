    size: 13
  - file: "gfonts://Roboto@500"
    id: font_micro
    size: 10
  - file: "gfonts://Roboto@700"
    id: font_arrow
    size: 34
  # Material Design Icons - Roboto and the Google Fonts subsets carry no
  # arrows at all. bpp: 4 gives anti-aliased glyphs, which hand-drawn
  # triangles could never be.
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_mdi
    size: 38
    bpp: 4
    glyphs:
      - "\U000F005D"   # arrow-up
      - "\U000F005C"   # arrow-top-right
      - "\U000F0054"   # arrow-right
      - "\U000F0043"   # arrow-bottom-right
      - "\U000F0045"   # arrow-down
      - "\U000F0E79"   # arrow-up-down
      - "\U000F0625"   # help-circle-outline
  # MDI glyphs are exactly 1em wide, so width == point size. A single arrow
  # has room to be big; a pair does not, because the value ends near x=154.
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_mdi_lg
    size: 64
    bpp: 4
    glyphs:
      - "\U000F005D"   # arrow-up
      - "\U000F005C"   # arrow-top-right
      - "\U000F0054"   # arrow-right
      - "\U000F0043"   # arrow-bottom-right
      - "\U000F0045"   # arrow-down
      - "\U000F0E79"   # arrow-up-down
      - "\U000F0625"   # help-circle-outline

display:
  - platform: st7789v
    id: disp
    model: TTGO_TDISPLAY_135X240
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    rotation: 90
    update_interval: 1s
    lambda: |-
      // thick  = shaft width, hw = half-width of the head's base,
      // spread = centre-to-centre offset of neighbouring arrows,
      // count  = 1, 2 or 3 arrows side by side (Nightscout has Triple too),
      // bidir  = a head at BOTH ends, which is how "RATE OUT OF RANGE" reads.
      // The shaft is two triangles rather than a stack of offset lines: at
      // 45 degrees the stacked lines land on the same pixels and leave the
      // shaft visibly hatched.
      auto draw_arrow = [&](int cx, int cy, float deg, int len, int thick,
                            int hw, int spread, int count, Color c,
                            bool bidir = false) {
        float r  = deg * 3.14159265f / 180.0f;
        float dx = cosf(r), dy = -sinf(r);
        float px = -dy, py = dx;
        int   offs[3] = {0, 0, 0};
        if (count == 2) { offs[0] = -spread; offs[1] = spread; }
        else if (count >= 3) { offs[0] = -spread; offs[1] = 0; offs[2] = spread; }
        int   hl = (int)(hw * 1.6f);
        float h  = thick / 2.0f;
        for (int k = 0; k < count && k < 3; k++) {
          float ox = px * offs[k], oy = py * offs[k];
          float hx = cx + dx * len * 0.5f + ox;
          float hy = cy + dy * len * 0.5f + oy;
          float tx = cx - dx * len * 0.5f + ox;
          float ty = cy - dy * len * 0.5f + oy;
          // shaft stops at the head's base - run it to the tip and it pokes
          // out around the triangle's apex
          float bx = hx - dx * hl, by = hy - dy * hl;
          float sx = tx, sy = ty;
          if (bidir) { sx = tx + dx * hl; sy = ty + dy * hl; }
          it.filled_triangle((int)(sx + px * h), (int)(sy + py * h),
                             (int)(sx - px * h), (int)(sy - py * h),
                             (int)(bx + px * h), (int)(by + py * h), c);
          it.filled_triangle((int)(sx - px * h), (int)(sy - py * h),
                             (int)(bx + px * h), (int)(by + py * h),
                             (int)(bx - px * h), (int)(by - py * h), c);
          it.filled_triangle((int)hx, (int)hy,
                             (int)(bx + px * hw), (int)(by + py * hw),
                             (int)(bx - px * hw), (int)(by - py * hw), c);
          if (bidir)
            it.filled_triangle((int)tx, (int)ty,
                               (int)(sx + px * hw), (int)(sy + py * hw),
                               (int)(sx - px * hw), (int)(sy - py * hw), c);
        }
      };

      auto band_color = [&](float v) -> Color {
        if (v <  id(n_urgent_low).state)  return id(c_urgent_low);
        if (v <  id(n_low).state)         return id(c_low);
        if (v <= id(n_high).state)        return id(c_in_range);
        if (v <  id(n_urgent_high).state) return id(c_high);
        return id(c_urgent_high);
      };

      id(g_blink) = !id(g_blink);

      float age_s = NAN;
      if (id(g_have)) {
        uint32_t elapsed = millis() - id(g_fetch_ms);
        age_s = id(g_age0) + (float) elapsed / 1000.0f;
      }
      bool stale = (!id(g_have) || isnan(id(g_bg)) || isnan(age_s) ||
                    age_s > id(n_stale).state * 60.0f);
      id(g_stale) = stale;
      // Stale data is still data. Rather than lock the other pages away, they
      // all render in greyscale while the feed is stale: the state is
      // unmistakable, but history and treatments stay readable, and every
      // page says how stale in minutes.
      // Stale palette: black ground, white words, grey data. Mapping by
      // luminance kept colours distinguishable, which is the opposite of what
      // is wanted - no shade here should read as a live band.
      auto G = [&](Color c) -> Color {
        if (!stale) return c;
        if (c.r == 0x0A && c.g == 0x0A && c.b == 0x0A) return Color(0, 0, 0);
        if (c.r == 0x60 && c.g == 0x7D && c.b == 0x8B) return Color(255, 255, 255);
        return Color(0x9A, 0x9A, 0x9A);
      };
      // Every page ends with this: a reserved strip so nothing can collide
      // with it, the live value or how stale it is, and the heartbeat.
      auto status = [&]() {
        it.filled_rectangle(0, 120, 240, 15, G(id(c_bgdark)));
        it.line(0, 120, 240, 120, G(id(c_dim)));
        // hard left, with the reading or the staleness hard right
        if (id(g_blink)) it.filled_circle(9, 127, 2, G(id(c_dim)));
        // With nothing ever received age_s is NaN, and (int)(NaN/60) is
        // undefined - it printed a nonsense hour count. No age, no message.
        if (stale && !isnan(age_s)) {
          int m = (int)(age_s / 60);
          if (m >= 60)
            it.printf(236, 122, id(font_tiny), G(id(c_white)), TextAlign::TOP_RIGHT,
                      "STALE FOR %dh %02dm", m / 60, m % 60);
          else
            it.printf(236, 122, id(font_tiny), G(id(c_white)), TextAlign::TOP_RIGHT,
                      "STALE FOR %d MIN", m);
        } else if (!isnan(id(g_bg))) {
          it.printf(236, 122, id(font_tiny), band_color(id(g_bg)),
                    TextAlign::TOP_RIGHT, id(g_mgdl) ? "NOW %.0f" : "NOW %.1f",
                    id(g_bg));
        }
      };

      // While stale an extra page slots in at the front: the first thing you
      // see is a plain statement that it is stale and how old, with the
      // struck-through reading one press away rather than merged into it.
      // Going stale inserts a page, which would otherwise shift whatever you
      // were looking at by one. Jump to the front instead - the change of
      // state is the news.
      static bool was_stale = false;
      if (stale != was_stale) { id(g_page) = 0; was_stale = stale; }

      int page = id(g_page);
      bool stale_info = false;
      if (stale && !id(ns_url).state.empty()) {
        if (page == 0)      stale_info = true;
        else if (page == 1) page = 0;
        else                page = page - 1;
      }

      // ---------------------------------------------------- 0: main
      if (page == 0) {
        if (id(ns_url).state.empty()) {
          it.fill(id(c_stale));
          it.printf(120, 14, id(font_mid), id(c_white), TextAlign::TOP_CENTER,
                    "SETUP");
          if (id(wifi_ip).state.empty()) {
            it.printf(120, 56, id(font_small), id(c_white),
                      TextAlign::TOP_CENTER, "Join wifi");
            it.printf(120, 78, id(font_small), id(c_in_range),
                      TextAlign::TOP_CENTER, "\"CGM Display Setup\"");
            it.printf(120, 100, id(font_tiny), id(c_white),
                      TextAlign::TOP_CENTER, "then http://192.168.4.1");
          } else {
            it.printf(120, 56, id(font_small), id(c_white),
                      TextAlign::TOP_CENTER, "Set the Nightscout URL at");
            it.printf(120, 80, id(font_small), id(c_in_range),
                      TextAlign::TOP_CENTER, "http://%s",
                      id(wifi_ip).state.c_str());
          }
          return;
        }
        if (stale) {
          it.fill(id(c_stale));
          Color sg = Color(0xB4, 0xB4, 0xB4);
          if (!id(g_have) || isnan(id(g_bg)) || isnan(age_s)) {
            it.printf(120, 8, id(font_mid), id(c_white), TextAlign::TOP_CENTER,
                      "NO DATA");
            it.printf(120, 44, id(font_small), id(c_white), TextAlign::TOP_CENTER,
                      "never received");
            if (id(wifi_ip).state.empty()) {
              it.printf(120, 84, id(font_tiny), id(c_white), TextAlign::TOP_CENTER,
                        "JOIN WIFI \"CGM Display Setup\"");
              it.printf(120, 100, id(font_tiny), id(c_white), TextAlign::TOP_CENTER,
                        "THEN http://192.168.4.1");
            } else {
              it.printf(120, 78, id(font_tiny), id(c_dim), TextAlign::TOP_CENTER,
                        "WIFI OK - CANNOT REACH");
              it.printf(120, 91, id(font_tiny), id(c_white), TextAlign::TOP_CENTER,
                        "%s", id(ns_url).state.empty()
                              ? "(no link set)" : id(ns_url).state.c_str());
              it.printf(120, 104, id(font_tiny), id(c_white), TextAlign::TOP_CENTER,
                        "SET LINK AT http://%s", id(wifi_ip).state.c_str());
            }
            status();
            return;
          }
          if (stale_info) {
            int m = (int)(age_s / 60);
            it.printf(120, 14, id(font_mid), id(c_white), TextAlign::TOP_CENTER,
                      "STALE DATA");
            if (m >= 60)
              it.printf(120, 52, id(font_mid), sg, TextAlign::TOP_CENTER,
                        "%dh %02dm AGO", m / 60, m % 60);
            else
              it.printf(120, 52, id(font_mid), sg, TextAlign::TOP_CENTER,
                        "%d MIN AGO", m);
            it.printf(120, 92, id(font_small), id(c_white), TextAlign::TOP_CENTER,
                      "press a button for history");
            status();
            return;
          }
          float sv = id(g_bg);
          it.printf(6, 40, id(font_big), sg, TextAlign::CENTER_LEFT, "%.1f", sv);
          const std::string &sd = id(g_dir);
          const char *sar;
          if      (sd == "DoubleUp")          sar = "\U000F005D\U000F005D";
          else if (sd == "TripleUp")          sar = "\U000F005D\U000F005D\U000F005D";
          else if (sd == "SingleUp")          sar = "\U000F005D";
          else if (sd == "FortyFiveUp")       sar = "\U000F005C";
          else if (sd == "Flat")              sar = "\U000F0054";
          else if (sd == "FortyFiveDown")     sar = "\U000F0043";
          else if (sd == "SingleDown")        sar = "\U000F0045";
          else if (sd == "DoubleDown")        sar = "\U000F0045\U000F0045";
          else if (sd == "TripleDown")        sar = "\U000F0045\U000F0045\U000F0045";
          else if (sd == "RATE OUT OF RANGE") sar = "\U000F0E79";
          else                                sar = "\U000F0625";
          bool smulti = (sd == "DoubleUp" || sd == "DoubleDown" ||
                         sd == "TripleUp" || sd == "TripleDown");
          it.printf(238, 38, smulti ? id(font_mdi) : id(font_mdi_lg), sg,
                    TextAlign::CENTER_RIGHT, "%s", sar);
          it.filled_rectangle(2, 38, 236, 4, sg);
          it.printf(6, 86, id(font_tiny), id(c_dim), TextAlign::TOP_LEFT,
                    "LAST DELTA");
          it.printf(6, 98, id(font_small), sg, TextAlign::TOP_LEFT,
                    "%+.1f", id(g_delta));
          status();
          return;
        }
        float v = id(g_bg);
        Color bgc = band_color(v);
        Color txt = (v < id(n_urgent_low).state) ? id(c_white) : id(c_black);
        it.fill(bgc);
        it.printf(6, 42, id(font_big), txt, TextAlign::CENTER_LEFT, "%.1f", v);
        // Every value Nightscout's direction.js can produce. TripleUp/Down
        // never come from Dexcom Share but xDrip and Libre uploaders do send
        // them, and an unhandled trend silently degrades to a question mark.
        // Glyphs, not triangles: anti-aliased, and the same symbols
        // Nightscout itself uses. Right-aligned so a double never runs off.
        const std::string &d = id(g_dir);
        const char *ar;
        if      (d == "DoubleUp")          ar = "\U000F005D\U000F005D";
        else if (d == "TripleUp")          ar = "\U000F005D\U000F005D\U000F005D";
        else if (d == "SingleUp")          ar = "\U000F005D";
        else if (d == "FortyFiveUp")       ar = "\U000F005C";
        else if (d == "Flat")              ar = "\U000F0054";
        else if (d == "FortyFiveDown")     ar = "\U000F0043";
        else if (d == "SingleDown")        ar = "\U000F0045";
        else if (d == "DoubleDown")        ar = "\U000F0045\U000F0045";
        else if (d == "TripleDown")        ar = "\U000F0045\U000F0045\U000F0045";
        else if (d == "RATE OUT OF RANGE") ar = "\U000F0E79";
        else                               ar = "\U000F0625";
        // one glyph gets the big face; two or three have to stay narrow or
        // they run into the value. A triple only ever comes from xDrip and
        // will crowd it slightly - Dexcom Share never sends one.
        bool multi = (d == "DoubleUp" || d == "DoubleDown" ||
                      d == "TripleUp" || d == "TripleDown");
        it.printf(238, 40, multi ? id(font_mdi) : id(font_mdi_lg), txt,
                  TextAlign::CENTER_RIGHT, "%s", ar);

        // labelled, so neither number needs explaining
        int m = (int)(age_s / 60), sec = (int)age_s % 60;
        it.printf(6,   86, id(font_tiny), txt, TextAlign::TOP_LEFT,
                  "LAST DELTA");
        it.printf(6,   98, id(font_small), txt, TextAlign::TOP_LEFT,
                  "%+.1f", id(g_delta));
        it.printf(236, 86, id(font_tiny), txt, TextAlign::TOP_RIGHT,
                  "READING AGE");
        it.printf(236, 98, id(font_small), txt, TextAlign::TOP_RIGHT,
                  "%d:%02d", m, sec);
        if (id(g_blink)) it.filled_circle(120, 128, 3, txt);
        return;
      }

      // ---------------------------------------------------- 1: 3h graph
      if (page == 1) {
        it.fill(G(id(c_bgdark)));
        const auto &h = id(g_hist);
        bool mg = id(g_mgdl);
        const char *f = mg ? "%.0f" : "%.1f";

        it.printf(6, 1, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT,
                  "%.0f HOURS", id(n_graph_h).state);

        int x0 = 36, x1 = 236, y0 = 18, y1 = 86;

        if (h.empty()) {
          it.printf(136, 55, id(font_small), G(id(c_dim)), TextAlign::CENTER,
                    "no history yet");
          status();
          return;
        }

        // auto-scale to the data, but always keep the target band on screen
        float dmn = 1e9f, dmx = -1e9f, sum = 0.0f;
        int inr = 0, n = h.size();
        for (int i = 0; i < n; i++) {
          float v = h[i];
          if (v < dmn) dmn = v;
          if (v > dmx) dmx = v;
          sum += v;
          if (v >= id(n_low).state && v <= id(n_high).state) inr++;
        }
        float lo = fminf(dmn, id(n_low).state);
        float hi = fmaxf(dmx, id(n_high).state);
        float pad = (hi - lo) * 0.10f;
        if (pad < (mg ? 9.0f : 0.5f)) pad = mg ? 9.0f : 0.5f;
        lo -= pad; hi += pad;
        auto ypix = [&](float v) -> int {
          if (v < lo) v = lo;
          if (v > hi) v = hi;
          return (int)(y1 - (v - lo) / (hi - lo) * (y1 - y0));
        };

        // --- vertical scale: labelled ticks at round values -------------
        float step = mg ? 50.0f : 2.0f;
        while ((hi - lo) / step > 6.0f) step *= 2.0f;
        float t0 = ceilf(lo / step) * step;
        for (float tv = t0; tv <= hi; tv += step) {
          int ty = ypix(tv);
          it.line(x0 - 3, ty, x0, ty, G(id(c_dim)));            // tick mark
          it.printf(x0 - 5, ty, id(font_tiny), G(id(c_dim)),
                    TextAlign::CENTER_RIGHT, mg ? "%.0f" : "%.0f", tv);
        }
        it.line(x0, y0, x0, y1, G(id(c_dim)));                  // axis line

        // all four thresholds, as Nightscout draws them
        int yul = ypix(id(n_urgent_low).state),  yl = ypix(id(n_low).state);
        int yh  = ypix(id(n_high).state),        yuh = ypix(id(n_urgent_high).state);
        for (int x = x0 + 2; x < x1; x += 10) {
          if (id(n_urgent_low).state  > lo) it.draw_pixel_at(x, yul, G(id(c_urgent_low)));
          if (id(n_urgent_high).state < hi) it.draw_pixel_at(x, yuh, G(id(c_urgent_high)));
        }
        for (int x = x0 + 2; x < x1; x += 5) {
          it.draw_pixel_at(x, yl, G(id(c_low)));
          it.draw_pixel_at(x, yh, G(id(c_high)));
        }

        for (int i = 0; i < n; i++) {
          int x = x0 + (int)((float) i / (float)(n > 1 ? n - 1 : 1) * (x1 - x0));
          it.filled_circle(x, ypix(h[i]), 2, G(band_color(h[i])));
        }

        float avg = sum / n;
        int tir = (int)(100.0f * inr / n + 0.5f);
        it.printf(6, 90, id(font_micro), G(id(c_dim)), TextAlign::TOP_LEFT, "LOWEST");
        it.printf(64, 90, id(font_micro), G(id(c_dim)), TextAlign::TOP_LEFT, "AVERAGE");
        it.printf(130, 90, id(font_micro), G(id(c_dim)), TextAlign::TOP_LEFT, "HIGHEST");
        it.printf(190, 90, id(font_micro), G(id(c_dim)), TextAlign::TOP_LEFT, "IN RANGE");
        it.printf(6, 101, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT, f, dmn);
        it.printf(64, 101, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT, f, avg);
        it.printf(130, 101, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT, f, dmx);
        it.printf(190, 101, id(font_small),
                  tir >= 70 ? G(id(c_in_range)) : G(id(c_high)),
                  TextAlign::TOP_LEFT, "%d%%", tir);
        status();
        return;
      }

      // ---------------------------------------------------- 2: treatments
      if (page == 2) {
        it.fill(G(id(c_bgdark)));
        it.printf(6, 1, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT,
                  "RECENT TREATMENTS");
        if (!id(g_tx_have) || id(g_tx_c).empty()) {
          it.printf(120, 60, id(font_small), G(id(c_dim)), TextAlign::CENTER,
                    "none recorded");
          status();
          return;
        }
        it.line(6, 15, 236, 15, G(id(c_dim)));

        // column headings - colour alone should never be the only signal
        it.printf(6,   17, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "CARBS");
        it.printf(88,  17, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "INSULIN");
        it.printf(236, 17, id(font_tiny), G(id(c_dim)), TextAlign::TOP_RIGHT, "WHEN");

        const auto &vc = id(g_tx_c);
        const auto &vi = id(g_tx_i);
        const auto &va = id(g_tx_age);
        float since = (float)(millis() - id(g_tx_at)) / 1000.0f;
        int n = vc.size();
        for (int k = 0; k < n && k < 3; k++) {
          int y = 31 + k * 20;
          bool age_ok = va[k] >= 0.0f;          // -1 means we have no clock
          float age = age_ok ? va[k] + since : 0.0f;
          int hh = (int)(age / 3600), mm = ((int) age % 3600) / 60;
          if (vc[k] > 0)
            it.printf(6, y, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT,
                      "%.0f g", vc[k]);
          else
            it.printf(6, y, id(font_small), G(id(c_faint)), TextAlign::TOP_LEFT, "--");
          if (vi[k] > 0)
            it.printf(88, y, id(font_small), G(id(c_in_range)), TextAlign::TOP_LEFT,
                      "%.2f U", vi[k]);
          else
            it.printf(88, y, id(font_small), G(id(c_faint)), TextAlign::TOP_LEFT, "--");
          if (!age_ok)
            it.printf(236, y + 3, id(font_tiny), G(id(c_faint)), TextAlign::TOP_RIGHT,
                      "--");
          else if (hh > 0)
            it.printf(236, y + 3, id(font_tiny), G(id(c_faint)), TextAlign::TOP_RIGHT,
                      "%dh %02dm", hh, mm);
          else
            it.printf(236, y + 3, id(font_tiny), G(id(c_faint)), TextAlign::TOP_RIGHT,
                      "%d min", mm);
        }

        // one line, so it clears both the third treatment row above and the
        // status strip below
        it.line(6, 96, 236, 96, G(id(c_dim)));
        // COB/IOB used to sit here at y=86, but the third treatment row (y=71,
        // font_small) overran them. They now live on the main page instead.
        it.printf(6,   102, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "24H TOTAL");
        it.printf(66,  102, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "CRB");
        it.printf(90,  102, id(font_tiny), G(id(c_white)), TextAlign::TOP_LEFT,
                  "%.0f g", id(g_tx_tot_c));
        it.printf(152, 102, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "INS");
        it.printf(236, 102, id(font_tiny), G(id(c_in_range)), TextAlign::TOP_RIGHT,
                  "%.2f U", id(g_tx_tot_i));
        status();
        return;
      }

      // ---------------------------------------------------- 6: recent alerts
      if (page == 6) {
        it.fill(G(id(c_bgdark)));
        it.printf(6, 1, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT,
                  "RECENT ALERTS");
        it.printf(236, 1, id(font_tiny), G(id(c_dim)), TextAlign::TOP_RIGHT,
                  "PAST EVENTS");
        it.line(6, 15, 236, 15, G(id(c_dim)));
        if (!id(g_al_have) || id(g_al_txt).empty()) {
          it.printf(120, 60, id(font_small), G(id(c_dim)), TextAlign::CENTER,
                    "nothing recorded");
          status();
          return;
        }
        const auto &vt = id(g_al_txt);
        const auto &va = id(g_al_age);
        const auto &vs = id(g_al_sev);
        const auto &vd = id(g_al_dev);
        float since = (float)(millis() - id(g_al_at)) / 1000.0f;
        int n = vt.size();
        for (int k = 0; k < n && k < 5; k++) {
          int y = 18 + k * 21;
          // severity carries a word as well as a colour - PUMP/CGM says which
          // system complained, and colour alone should never be the only cue
          Color c = vs[k] >= 2 ? G(id(c_urgent_high))
                  : vs[k] == 1 ? G(id(c_high))
                               : G(id(c_faint));
          it.printf(6, y, id(font_tiny), c, TextAlign::TOP_LEFT,
                    vd[k] ? "DEV" : "BG");
          it.printf(34, y, id(font_tiny), G(id(c_white)), TextAlign::TOP_LEFT,
                    "%s", vt[k].c_str());
          if (va[k] < 0) {
            it.printf(236, y, id(font_tiny), G(id(c_faint)), TextAlign::TOP_RIGHT, "--");
            continue;
          }
          float a = va[k] + since;
          int d = (int)(a / 86400.0f);
          int h = ((int)(a / 3600.0f)) % 24;
          int m = ((int)(a / 60.0f)) % 60;
          if (d > 0)
            it.printf(236, y, id(font_tiny), G(id(c_faint)), TextAlign::TOP_RIGHT,
                      "%dd %dh", d, h);
          else if (h > 0)
            it.printf(236, y, id(font_tiny), G(id(c_faint)), TextAlign::TOP_RIGHT,
                      "%dh %02dm", h, m);
          else
            it.printf(236, y, id(font_tiny), G(id(c_faint)), TextAlign::TOP_RIGHT,
                      "%d min", m);
        }
        status();
        return;
      }

      // ------------------------------------------------ 5: pod / sensor age
      if (page == 5) {
        it.fill(G(id(c_bgdark)));
        it.printf(6, 1, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT,
                  "WEAR TIME");
        // name the right-hand column, so the big number needs no explaining
        it.printf(236, 1, id(font_tiny), G(id(c_dim)), TextAlign::TOP_RIGHT,
                  "TIME LEFT");
        it.line(6, 15, 236, 15, G(id(c_dim)));
        if (!id(g_ages_have)) {
          it.printf(120, 60, id(font_small), G(id(c_dim)), TextAlign::CENTER,
                    "no changes logged");
          status();
          return;
        }
        float since = (float)(millis() - id(g_ages_at)) / 1000.0f;
        // Omnipod runs 72h + an 8h grace period; G7 is 10 days + 12h.
        // Colour turns as the nominal life is reached, not at expiry.
        // urgent_h doubles as the nominal life, so "left" counts down to it
        // urgent_h is the nominal life; colour thresholds are percentages
        // set on the web page, so they cover all three alike.
        struct Row { const char *label; float age; float urgent_h; };
        Row rows[3] = {
          { "SENSOR",    id(g_sage), id(n_sensor_life).state },
          { "POD",       id(g_cage), id(n_pod_life).state    },
          { "RESERVOIR", id(g_iage), id(n_res_life).state    },
        };
        // Reservoir folds into POD unless the user asks for it separately.
        // Two rows then get more breathing room instead of a gap at the end.
        bool sep_res = id(sw_sep_res).state;
        int nrows = sep_res ? 3 : 2;
        int step  = sep_res ? 34 : 45;
        // A row spans y..y+32 and the status strip starts at 120. With three
        // rows the space is exactly used; with two, start lower so the gap
        // above the first matches the gap below the last instead of pooling
        // all of it at the bottom.
        int y0    = sep_res ? 16 : 27;
        for (int k = 0; k < nrows; k++) {
          int y = y0 + k * step;
          it.printf(6, y, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT,
                    "%s", rows[k].label);
          if (rows[k].age < 0) {
            it.printf(236, y + 2, id(font_small), G(id(c_dim)),
                      TextAlign::TOP_RIGHT, "--");
            continue;
          }
          float h = (rows[k].age + since) / 3600.0f;
          float left = rows[k].urgent_h - h;
          int pct_left = 100 - (int)(100.0f * h / rows[k].urgent_h);
          if (pct_left > 100) pct_left = 100;
          if (pct_left < 0) pct_left = 0;
          Color c = left <= 0                            ? G(id(c_urgent_low))
                  : pct_left <= id(n_urgent_pct).state   ? G(id(c_urgent_high))
                  : pct_left <= id(n_warn_pct).state     ? G(id(c_high))
                                                         : G(id(c_in_range));
          // how long it has been worn, small, under the name
          int ud = (int)(h / 24.0f), uh = (int)h % 24, um = (int)((h - (int)h) * 60.0f);
          if (ud > 0)
            it.printf(6, y + 13, id(font_tiny), G(id(c_faint)), TextAlign::TOP_LEFT,
                      "%dd %dh used", ud, uh);
          else
            it.printf(6, y + 13, id(font_tiny), G(id(c_faint)), TextAlign::TOP_LEFT,
                      "%dh %02dm used", uh, um);
          // Past zero it counts UP rather than just saying OVERDUE - by ten
          // minutes and by two days are very different situations.
          if (left <= 0) {
            float over = -left;
            if (over >= 24.0f)
              it.printf(236, y + 2, id(font_mid), c, TextAlign::TOP_RIGHT,
                        "OVER %dd", (int)(over / 24.0f));
            else
              it.printf(236, y + 2, id(font_mid), c, TextAlign::TOP_RIGHT,
                        "OVER %dh", (int)over);
          } else if (left >= 24.0f)
            it.printf(236, y + 2, id(font_mid), c, TextAlign::TOP_RIGHT,
                      "%dd %dh", (int)(left / 24.0f), (int)left % 24);
          else
            it.printf(236, y + 2, id(font_mid), c, TextAlign::TOP_RIGHT,
                      "%dh %02dm", (int)left, (int)((left - (int)left) * 60.0f));
          // percentage sits between the bar and the time, smaller than both
          it.printf(112, y + 18, id(font_tiny), c, TextAlign::TOP_RIGHT,
                    "%d%%", pct_left);
          // track and fill both map to the same grey when stale, so the bar
          // needs an explicit dark/light pair or it disappears
          int bw = 80 * pct_left / 100;
          Color trk = stale ? Color(0x3C, 0x3C, 0x3C) : id(c_dim);
          Color fil = stale ? Color(0xC8, 0xC8, 0xC8) : c;
          it.rectangle(6, y + 27, 80, 5, trk);
          if (bw > 0)
            it.filled_rectangle(6 + 80 - bw, y + 27, bw, 5, fil);
        }
        status();
        return;
      }

      // ---------------------------------------------------- 3: stats
      if (page == 3) {
        it.fill(G(id(c_bgdark)));
        bool mg = id(g_mgdl);
        const char *f = mg ? "%.0f" : "%.1f";
        const char *un = mg ? "mg/dL" : "mmol/L";
        if (!id(g_s_have)) {
          it.printf(6, 1, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "STATISTICS");
          it.printf(120, 60, id(font_small), G(id(c_dim)), TextAlign::CENTER,
                    "gathering...");
          return;
        }
        int expect = (int)(id(g_s_hours) * 12.0f + 0.5f);
        int cov = expect > 0 ? (int)(100.0f * id(g_s_n) / expect + 0.5f) : 0;
        if (cov > 100) cov = 100;

        // header carries the window AND the feed health, freeing the bottom
        it.printf(6, 1, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT,
                  "LAST %.0f HOURS", id(g_s_hours));
        it.printf(236, 1, id(font_tiny),
                  cov >= 90 ? G(id(c_dim)) : G(id(c_high)),
                  TextAlign::TOP_RIGHT, "%d rdgs   FEED %d%%", id(g_s_n), cov);
        it.line(6, 16, 236, 16, G(id(c_dim)));

        // three time percentages - columns spaced so nothing collides
        it.printf(6,   21, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "IN RANGE");
        it.printf(112, 21, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "LOW");
        it.printf(178, 21, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "HIGH");
        it.printf(6,   34, id(font_small),
                  id(g_s_tir) >= 70 ? G(id(c_in_range)) : G(id(c_high)),
                  TextAlign::TOP_LEFT, "%d%%", id(g_s_tir));
        it.printf(112, 34, id(font_small), G(id(c_low)), TextAlign::TOP_LEFT,
                  "%d%%", id(g_s_lowpct));
        it.printf(178, 34, id(font_small), G(id(c_high)), TextAlign::TOP_LEFT,
                  "%d%%", id(g_s_highpct));
        char rb[26];
        snprintf(rb, sizeof(rb), mg ? "%.0f-%.0f %s" : "%.1f-%.1f %s",
                 id(n_low).state, id(n_high).state, un);
        it.printf(6, 55, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "%s", rb);
        it.line(6, 71, 236, 71, G(id(c_dim)));

        // glucose figures
        it.printf(6, 75, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT,
                  "GLUCOSE  %s", un);
        it.printf(6,   86, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "LOWEST");
        it.printf(92,  86, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "AVERAGE");
        it.printf(174, 86, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "HIGHEST");
        it.printf(6,    99, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT, f, id(g_s_min));
        it.printf(92,   99, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT, f, id(g_s_avg));
        it.printf(174,  99, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT, f, id(g_s_max));
        status();
        return;
      }

      // ---------------------------------------------------- 4: diagnostics
      it.fill(G(id(c_bgdark)));
      it.printf(6, 2, id(font_tiny), G(id(c_dim)), TextAlign::TOP_LEFT, "DEVICE");
      int y = 20;
      it.printf(6, y, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT,
                "IP  %s", id(wifi_ip).state.c_str()); y += 19;
      it.printf(6, y, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT,
                "RSSI  %.0f dBm", id(wifi_rssi).state); y += 19;
      float up = id(dev_uptime).state;
      it.printf(6, y, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT,
                "UP  %dh %dm", (int)(up / 3600), ((int) up % 3600) / 60); y += 19;
      it.printf(6, y, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT,
                "HEAP  %.0f KB", id(heap_free).state / 1024.0f); y += 19;
      it.printf(6, y, id(font_small), G(id(c_white)), TextAlign::TOP_LEFT,
                "UNITS  %s", id(g_mgdl) ? "mg/dL" : "mmol/L");
      it.printf(236, 2, id(font_tiny), G(id(c_dim)), TextAlign::TOP_RIGHT,
                "THRESHOLDS %s", id(g_th_from_ns) ? "AUTO" : "MANUAL");
      // Which firmware this actually is - bottom right, level with UNITS on
      // the left. The web page knows, but the device should be able to answer
      // it on its own.
      it.printf(236, 96, id(font_small), G(id(c_white)), TextAlign::TOP_RIGHT,
                "FW %s", ESPHOME_PROJECT_VERSION);
      // The right half of this page is otherwise empty, so a waiting update
      // gets to say so plainly rather than only on the web page.
      if (id(fw_update).state == update::UPDATE_STATE_AVAILABLE &&
          version_is_newer(id(fw_update).update_info.latest_version,
                           ESPHOME_PROJECT_VERSION)) {
        it.printf(236, 39, id(font_small), G(id(c_urgent_low)), TextAlign::TOP_RIGHT,
                  "UPDATE");
        it.printf(236, 58, id(font_small), G(id(c_urgent_low)), TextAlign::TOP_RIGHT,
                  "AVAILABLE");
      }
      status();
