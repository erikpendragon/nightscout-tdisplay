# LilyGO T-Display (ESP32) - standalone Nightscout glucose display
#
# Reads Nightscout DIRECTLY over HTTP. No Home Assistant, no MQTT, no broker,
# and no clock: the device works out how old a reading is from Nightscout's
# own "now", so it never needs SNTP and never drifts.
#
#   First boot : the board is an access point called "CGM Display Setup" -
#                join it and enter your wifi there. Nothing is compiled in.
#   Then       : browse to the device's IP -> set the Nightscout URL,
#                the token (only if your instance needs one), and thresholds
#
# Everything above is stored on the device, so the same firmware image can be
# handed to someone else and pointed at their own Nightscout without a reflash.
#
# Pages: top button cycles forward, bottom goes back, both together flips the
# screen 180 degrees, 15s idle returns to the main page.
#   0 main - current value, trend arrow, delta, reading age
#   1 graph - configurable 1-24h with a labelled axis and threshold lines
#   2 treatments - last 3 carb/insulin entries plus 24h totals
#   3 stats - time in range, low, high, min/max/avg, feed health
#   4 diagnostics - IP, RSSI, uptime, free heap, detected units
#   5 wear time - pod / sensor / reservoir age, from the pump's own record
#   6 recent alerts - last 5 pump/CGM alarms with how long ago. These are
#       PAST events, not live state - the feed never says one recovered.
#
# NOT A MEDICAL DEVICE. It shows a number that is already several minutes old
# by the time it arrives. Do not dose from it. There are deliberately no
# alarms - do not rely on it to wake anyone up.
#
# Hardware: LilyGO T-Display, ESP32-D0WDQ6-V3, ST7789V 135x240.
# GPIO4 is the backlight and is owned by the TTGO_TDISPLAY_135X240 preset -
# declaring an output on it is a fatal config error, not a warning.

substitutions:
  # ---- naming -------------------------------------------------------------
  # This is the hostname: with the default below the device answers to
  # cgm-display.local. Change it to kitchen-cgm and it becomes
  # kitchen-cgm.local. Lower case, digits and hyphens only.
  #
  # ESPHome bakes the name into the firmware - mDNS and the DHCP hostname both
  # read it once at startup and there is no runtime setter - so changing it
  # means a rebuild and reflash. It cannot be a setting on the web page.
  device_name: cgm-display
  # Shown in Home Assistant and as the web page title. Free text.
  friendly_name: CGM Display

  # Where the device looks for new firmware. Point this at your own fork if
  # you publish your own builds.
  fw_manifest: "https://erikpendragon.github.io/nightscout-tdisplay/manifest.json"

  # ---- glucose units -------------------------------------------------------
  # The display auto-detects mg/dL vs mmol/L from Nightscout for formatting,
  # but the threshold sliders need sane ranges at compile time. Defaults are
  # mmol/L. For mg/dL, comment this block out and uncomment the one below.
  bg_units: "mmol/L"
  th_step:  "0.1"
  ul_init:  "3.1"
  ul_min:   "2.0"
  ul_max:   "6.0"
  lo_init:  "4.0"
  lo_min:   "2.5"
  lo_max:   "7.0"
  hi_init:  "10.0"
  hi_min:   "6.0"
  hi_max:   "16.0"
  uh_init:  "14.0"
  uh_min:   "8.0"
  uh_max:   "25.0"

  # ---- mg/dL ---------------------------------------------------------------
  # bg_units: "mg/dL"
  # th_step:  "1"
  # ul_init:  "55"
  # ul_min:   "40"
  # ul_max:   "110"
  # lo_init:  "70"
  # lo_min:   "45"
  # lo_max:   "125"
  # hi_init:  "180"
  # hi_min:   "110"
  # hi_max:   "290"
  # uh_init:  "250"
  # uh_min:   "145"
  # uh_max:   "450"

  # These are placeholders. Use the numbers your own care team set in the
  # Dexcom/Nightscout app - every percentage on the device is measured
  # against them, so wrong thresholds make every statistic wrong.

# Dotted-numeric version compare. ESPHome's update component only asks whether
# the manifest's version STRING differs from the compiled-in one, so pointing a
# device at an older manifest reads as "update available". This is how the
# device tells an upgrade from a downgrade.
esphome:
  includes:
    - version_compare.h
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "erikpendragon.cgm-display"
    version: "1.0.14"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(disp).set_rotation(id(g_flip) ? DISPLAY_ROTATION_270_DEGREES
                                           : DISPLAY_ROTATION_90_DEGREES);
          // A template text_sensor with update_interval: never never runs its
          // lambda, so the version has to be published once, here.
          id(ts_fw_version).publish_state(ESPHOME_PROJECT_VERSION);
          // Restoring a saved value does NOT fire the text's on_value, so the
          // boot path has to apply it itself. That was invisible while the
          // field was always set - source: ${fw_manifest} is compiled in, and
          // on_value only ever mattered when someone edited the field. With a
          // blank saved value it is not invisible at all: the compiled-in URL
          // stays live, so the field reads empty while updates quietly run.
          const std::string &saved = id(fw_url).state;
          id(g_upd_off) = saved.empty();
          id(fw_update).set_source_url(saved);
          if (id(g_upd_off))
            id(fw_update).stop_poller();
          id(ts_upd_status).publish_state(id(g_upd_off)
            ? "Updates disabled - set a manifest URL to re-enable"
            : "Not checked yet");

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"

logger:
  level: INFO

# Present so `esphome logs` and Home Assistant can reach the device, but with
# no encryption key - a key baked into a published binary protects nothing,
# since everyone has it. Add your own for a private build:
#   encryption:
#     key: !secret cgm_display_api_key
api:
  # never reboot just because Home Assistant went away - it is not in the
  # data path and the display must keep working without it
  reboot_timeout: 0s

ota:
  # Likewise no OTA password by default. Anyone on your LAN can reflash this
  # board; on a $12 display that is the usual trade. Add
  #   password: !secret cgm_display_ota_password
  # if you would rather not.
  - platform: esphome
    # Given an id so a local config can add a password without forking this
    # file:  ota: [ - id: !extend ota_esphome, password: !secret ... ]
    id: ota_esphome
  # backend for the update entity below - no password of its own
  - platform: http_request

# Checks ${fw_manifest} and offers whatever version it advertises. Appears as
# an "Firmware" update entity on the device's web page and in Home Assistant,
# and installs on demand - it never updates itself unattended.
update:
  - platform: http_request
    name: "Firmware"
    # Internal: its own row only ever said "UPDATE AVAILABLE", which Update
    # Status reports with the version attached. The component still does all
    # the work - Check and Install drive it - it just has no row of its own.
    internal: true
    id: fw_update
    # ESPHome bakes this in at compile time, but the setter is public, so the
    # "Update Manifest URL" field below overrides it at runtime. Fork the repo,
    # host your own manifest, paste the URL in - no rebuild needed.
    source: ${fw_manifest}
    update_interval: 6h

# No wifi credentials anywhere in this config, and therefore none baked into
# the firmware image. The board comes up as its own access point, you join it
# and enter your network there, and ESPHome stores it in the device's flash -
# where it survives reboots and OTA updates. That is what makes a prebuilt
# binary safe to hand to someone else.
wifi:
  ap:
    ssid: "CGM Display Setup"
  on_connect:
    then:
      # Make everything due again, so a reconnect after an outage refreshes
      # the whole screen rather than trickling in over half an hour. The
      # scheduler then walks the fetches one per 5s tick - the first value
      # lands ~2s after the network is up, and nothing ever overlaps.
      #
      # Due times are stamped from millis(), never set to 0: past ~24.8 days
      # of uptime a literal 0 reads as "not due" under the signed compare and
      # the fetch would stall for another 24.8 days.
      - lambda: |-
          const uint32_t t = millis() + 2000;   // let DHCP/DNS settle first
          id(g_due_bg)     = t;
          id(g_due_tx)     = t;
          id(g_due_hist)   = t;
          id(g_due_ages)   = t;
          id(g_due_alarms) = t;
          id(g_due_stats)  = t;
          id(g_due_thresh) = t;

captive_portal:

web_server:
  port: 80
  version: 3
  # The config page must work with no internet - it is what you reach for when
  # something is wrong, and it lives in somebody else's house.
  #
  # Setting `local` to true looks like the answer but silently drops
  # js_include: with it set, handle_index_request() serves a prebuilt INDEX_GZ
  # and never uses the index carrying the <script src=/0.js> tag. You get
  # offline OR the UI tweaks, not both.
  #
  # So: js_url is blanked to suppress the CDN tag, and js_include serves
  # ESPHome's own bundle with cgm-ui.js appended (see build-webui.sh). One
  # request, to the device, containing everything.
  js_url: ""
  js_include: "./web-ui.js"
  sorting_groups:
    - id: grp_ns
      name: "Nightscout"
      sorting_weight: 10
    - id: grp_th
      name: "Blood glucose thresholds - from Nightscout unless the switch above is off"
      sorting_weight: 20
    - id: grp_wear
      name: "Hardware Replacement - pod, sensor and reservoir"
      sorting_weight: 25
    - id: grp_disp
      name: "Display"
      sorting_weight: 30
    - id: grp_upd
      name: "Updates"
      sorting_weight: 40
    - id: grp_diag
      name: "Diagnostics"
      sorting_weight: 50

http_request:
  useragent: esphome/cgm-display
  timeout: 6s
  verify_ssl: false

text:
  - platform: template
    name: "Nightscout URL"
    web_server:
      sorting_group_id: grp_ns
      sorting_weight: 1
    id: ns_url
    optimistic: true
    restore_value: true
    mode: text
    # Set this on the device's own web page after first boot, e.g.
    # http://nightscout.example.com  or  http://192.168.1.50:1337
    initial_value: ""
  - platform: template
    # Where to look for new firmware. Defaults to the upstream project; point
    # it at your own fork's manifest and the device will follow that instead.
    name: "Update Manifest URL"
    web_server:
      sorting_group_id: grp_upd
      sorting_weight: 6
    id: fw_url
    optimistic: true
    restore_value: true
    mode: text
    initial_value: "${fw_manifest}"
    on_value:
      - lambda: |-
          if (x.empty()) {
            // Genuinely off, not "ignored": the component is pointed at an
            // empty source so its own six-hourly poll cannot find anything,
            // and both buttons refuse below.
            id(g_upd_off) = true;
            id(fw_update).set_source_url("");
            // Stop the six-hourly poll as well, so "off" means nothing runs
            // rather than a fetch that fails quietly every six hours.
            id(fw_update).stop_poller();
            id(ts_upd_status).publish_state("Updates disabled - set a manifest URL to re-enable");
            ESP_LOGI("cgm", "update manifest cleared - updates disabled");
          } else {
            bool was_off = id(g_upd_off);
            id(g_upd_off) = false;
            id(fw_update).set_source_url(x);
            if (was_off)
              id(fw_update).start_poller();
            id(ts_upd_status).publish_state("Not checked yet");
            ESP_LOGI("cgm", "update manifest set");
          }
  - platform: template
    # Only needed if your Nightscout requires auth. A read-only token is
    # plenty - this device never writes. Leave blank for an open instance.
    name: "Token"
    web_server:
      sorting_group_id: grp_ns
      sorting_weight: 2
    id: ns_token
    optimistic: true
    restore_value: true
    mode: password
    initial_value: ""

number:
  - platform: template
    name: "Urgent Low"
    web_server:
      sorting_group_id: grp_th
      sorting_weight: 4
    id: n_urgent_low
    optimistic: true
    restore_value: true
    initial_value: ${ul_init}
    min_value: ${ul_min}
    max_value: ${ul_max}
    step: ${th_step}
    unit_of_measurement: "${bg_units}"
    mode: box
  - platform: template
    name: "Low"
    web_server:
      sorting_group_id: grp_th
      sorting_weight: 3
    id: n_low
    optimistic: true
    restore_value: true
    initial_value: ${lo_init}
    min_value: ${lo_min}
    max_value: ${lo_max}
    step: ${th_step}
    unit_of_measurement: "${bg_units}"
    mode: box
  - platform: template
    name: "High"
    web_server:
      sorting_group_id: grp_th
      sorting_weight: 2
    id: n_high
    optimistic: true
    restore_value: true
    initial_value: ${hi_init}
    min_value: ${hi_min}
    max_value: ${hi_max}
    step: ${th_step}
    unit_of_measurement: "${bg_units}"
    mode: box
  - platform: template
    name: "Urgent High"
    web_server:
      sorting_group_id: grp_th
      sorting_weight: 1
    id: n_urgent_high
    optimistic: true
    restore_value: true
    initial_value: ${uh_init}
    min_value: ${uh_min}
    max_value: ${uh_max}
    step: ${th_step}
    unit_of_measurement: "${bg_units}"
    mode: box
  - platform: template
    name: "Graph Hours"
    web_server:
      sorting_group_id: grp_disp
      sorting_weight: 1
    id: n_graph_h
    optimistic: true
    restore_value: true
    initial_value: 6
    min_value: 1
    max_value: 24
    step: 1
    unit_of_measurement: "h"
    mode: box
  - platform: template
    # Nightscout has no notion of how long a pod or sensor is meant to last -
    # its CAGE/SAGE settings are alert thresholds, not hardware lifetimes - so
    # these live on the device.
    name: "Pod life (hours)"
    id: n_pod_life
    web_server:
      sorting_group_id: grp_wear
      sorting_weight: 4
    optimistic: true
    restore_value: true
    initial_value: 72
    min_value: 12
    max_value: 240
    step: 1
    unit_of_measurement: "h"
    mode: box
  - platform: template
    name: "Sensor life (hours)"
    id: n_sensor_life
    web_server:
      sorting_group_id: grp_wear
      sorting_weight: 3
    optimistic: true
    restore_value: true
    initial_value: 264
    min_value: 24
    max_value: 480
    step: 1
    unit_of_measurement: "h"
    mode: box
  - platform: template
    name: "Reservoir life (hours)"
    id: n_res_life
    web_server:
      sorting_group_id: grp_wear
      sorting_weight: 6
    optimistic: true
    restore_value: true
    initial_value: 72
    min_value: 12
    max_value: 240
    step: 1
    unit_of_measurement: "h"
    mode: box
  - platform: template
    # Percentages of life REMAINING at which the pod / sensor / reservoir
    # countdown changes colour. One pair covers all three, despite their very
    # different lifetimes. Nothing to do with blood glucose.
    name: "Warning at % left"
    id: n_warn_pct
    web_server:
      sorting_group_id: grp_wear
      sorting_weight: 1
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 2
    max_value: 60
    step: 1
    unit_of_measurement: "%"
    mode: box
  - platform: template
    name: "Urgent at % left"
    id: n_urgent_pct
    web_server:
      sorting_group_id: grp_wear
      sorting_weight: 2
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 1
    max_value: 50
    step: 1
    unit_of_measurement: "%"
    mode: box
  - platform: template
    # How long a page other than the main one stays up before the display
    # falls back to it.
    name: "Idle Return"
    web_server:
      sorting_group_id: grp_disp
      sorting_weight: 3
    id: n_idle
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 3
    max_value: 300
    step: 1
    unit_of_measurement: "s"
    mode: box
  - platform: template
    name: "Stale After"
    web_server:
      sorting_group_id: grp_disp
      sorting_weight: 2
    id: n_stale
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 5
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    mode: box

globals:
  # Scheduler slots - millis() at which each fetch next becomes due. Zero
  # means "due now", so at boot they cascade one per tick instead of all at
  # once. See the `interval:` block for why this is a counter and not seven
  # separate intervals.
  - id: g_due_bg
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_due_tx
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_due_hist
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_due_ages
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_due_alarms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_due_stats
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_due_thresh
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_bg
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_delta
    type: float
    restore_value: false
    initial_value: '0.0f'
  # Nightscout works these out from the treatment log and returns them on
  # /pebble beside the reading we already ask for, so they cost no extra
  # request. NAN until the first fetch; the display shows "--" for that.
  # Blanking the manifest URL means "stop updating". Without this the empty
  # value was simply ignored and the previous URL stayed live, so a setting
  # that looked like an off switch quietly was not one.
  - id: g_upd_off
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_iob
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_cob
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_dir
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: g_age0
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: g_fetch_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_have
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_blink
    type: bool
    restore_value: false
    initial_value: 'false'
  # server clock, so treatment ages need no local time either
  - id: g_srv_now
    type: double
    restore_value: false
    initial_value: '0'
  - id: g_srv_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # true if this Nightscout reports mg/dL rather than mmol/L
  - id: g_mgdl
    type: bool
    restore_value: false
    initial_value: 'false'
  # 3h history, oldest first, already in display units
  - id: g_hist
    type: std::vector<float>
    restore_value: false
  # last treatment
  - id: g_tx_c
    type: std::vector<float>
    restore_value: false
  - id: g_tx_i
    type: std::vector<float>
    restore_value: false
  - id: g_tx_age
    type: std::vector<float>
    restore_value: false
  - id: g_tx_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_tx_tot_c
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: g_tx_tot_i
    type: float
    restore_value: false
    initial_value: '0.0f'
  # pod / sensor / reservoir ages, seconds at the moment of fetch. -1 unknown.
  - id: g_cage
    type: float
    restore_value: false
    initial_value: '-1.0f'
  - id: g_sage
    type: float
    restore_value: false
    initial_value: '-1.0f'
  - id: g_iage
    type: float
    restore_value: false
    initial_value: '-1.0f'
  - id: g_ages_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # last few Glooko alarms: text, age at fetch, severity 0=advisory 1=alert
  # 2=hazard, and whether it is a device fault rather than a glucose threshold
  - id: g_al_txt
    type: std::vector<std::string>
    restore_value: false
  - id: g_al_age
    type: std::vector<float>
    restore_value: false
  - id: g_al_sev
    type: std::vector<int>
    restore_value: false
  - id: g_al_dev
    type: std::vector<bool>
    restore_value: false
  - id: g_al_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_al_have
    type: bool
    restore_value: false
    initial_value: 'false'
  # true once Nightscout's own thresholds have been adopted
  - id: g_stale
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_th_from_ns
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_ages_have
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_tx_have
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_page
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_flip
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: g_s_min
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: g_s_max
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: g_s_avg
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: g_s_tir
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_s_lowpct
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_s_highpct
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_s_n
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_s_hours
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: g_s_have
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  - id: flip_screen
    mode: single
    then:
      - lambda: |-
          id(g_flip) = !id(g_flip);
          id(disp).set_rotation(id(g_flip) ? DISPLAY_ROTATION_270_DEGREES
                                           : DISPLAY_ROTATION_90_DEGREES);
          id(sw_flip).publish_state(id(g_flip));
          ESP_LOGI("cgm", "screen flipped -> %s", id(g_flip) ? "270" : "90");

  - id: page_timeout
    mode: restart
    then:
      # While stale you are reading for context, not glancing - give it
      # longer before snapping back. Deliberately not user-settable.
      - delay: !lambda |-
          return (uint32_t)((id(g_stale) ? 30.0f : id(n_idle).state) * 1000);
      - lambda: 'id(g_page) = 0;'

  - id: fetch_bg
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            std::string u = id(ns_url).state;
            while (!u.empty() && u.back() == '/') u.pop_back();
            u += "/pebble";
            const std::string &tk = id(ns_token).state;
            if (!tk.empty())
              u += (u.find('?') == std::string::npos ? "?token=" : "&token=") + tk;
            return u;
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["bgs"].is<JsonArray>()) return false;
                    JsonArray bgs = root["bgs"].as<JsonArray>();
                    if (bgs.size() == 0) return false;
                    JsonObject b = bgs[0];
                    float v = b["sgv"].as<float>();
                    id(g_mgdl) = (v > 35.0f);          // auto-detect units
                    id(g_bg)    = v;
                    id(g_delta) = b["bgdelta"].as<float>();
                    id(g_dir)   = b["direction"].as<std::string>();
                    // /pebble is inconsistent about these two: iob arrives as a
                    // JSON *string* ("0", "1.25") while cob comes through as a
                    // number. is<float>() is false for the string form, so every
                    // real IOB became NAN and printed "--". as<float>() parses
                    // either, leaving only a genuinely absent field as unknown.
                    // Parsed but not currently shown anywhere - too small to be
                    // useful at the sizes the bottom margin allows, and the main
                    // page is meant to be readable from across the room. Kept
                    // because /pebble returns them either way, so they cost
                    // nothing and can be put back wherever they earn the space.
                    id(g_iob) = b["iob"].isNull() ? NAN : b["iob"].as<float>();
                    id(g_cob) = b["cob"].isNull() ? NAN : b["cob"].as<float>();
                    double now_ms = 0, dt_ms = b["datetime"].as<double>();
                    if (root["status"].is<JsonArray>()) {
                      JsonArray st = root["status"].as<JsonArray>();
                      if (st.size() > 0) now_ms = st[0]["now"].as<double>();
                    }
                    id(g_age0) = (now_ms > 0 && dt_ms > 0)
                                   ? (float)((now_ms - dt_ms) / 1000.0) : 0.0f;
                    id(g_fetch_ms) = millis();
                    if (now_ms > 0) { id(g_srv_now) = now_ms; id(g_srv_at) = millis(); }
                    id(g_have) = true;
                    ESP_LOGI("cgm", "%.1f %s d=%+.1f", id(g_bg),
                             id(g_dir).c_str(), id(g_delta));
                    return true;
                  });

  - id: fetch_hist
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            std::string u = id(ns_url).state;
            while (!u.empty() && u.back() == '/') u.pop_back();
            char q[64];
            snprintf(q, sizeof(q), "/pebble?count=%d",
                     (int)(id(n_graph_h).state * 12));
            u += q;
            const std::string &tk = id(ns_token).state;
            if (!tk.empty())
              u += (u.find('?') == std::string::npos ? "?token=" : "&token=") + tk;
            return u;
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("cgm", "hist resp %d len=%d",
                           response->status_code, (int) body.length());
                  if (response->status_code != 200) return;
                  // /pebble is an object, and already in DISPLAY units - no
                  // mg/dL conversion, and 3.5x smaller than entries.json
                  json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["bgs"].is<JsonArray>()) return false;
                    JsonArray bgs = root["bgs"].as<JsonArray>();
                    std::vector<float> tmp;
                    for (JsonVariant b : bgs) {
                      float v = b["sgv"].as<float>();
                      if (v > 0) tmp.push_back(v);
                    }
                    std::reverse(tmp.begin(), tmp.end());   // pebble is newest-first
                    id(g_hist) = tmp;
                    ESP_LOGI("cgm", "history %d pts", (int) tmp.size());
                    return true;
                  });

  - id: fetch_stats
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            std::string u = id(ns_url).state;
            while (!u.empty() && u.back() == '/') u.pop_back();
            u += "/pebble?count=288";
            const std::string &tk = id(ns_token).state;
            if (!tk.empty())
              u += (u.find('?') == std::string::npos ? "?token=" : "&token=") + tk;
            return u;
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("cgm", "stats resp %d len=%d",
                           response->status_code, (int) body.length());
                  if (response->status_code != 200) return;
                  json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["bgs"].is<JsonArray>()) return false;
                    JsonArray bgs = root["bgs"].as<JsonArray>();
                    // compute while streaming - never store 288 points
                    float mn = 1e9f, mx = -1e9f, sum = 0.0f;
                    int n = 0, inr = 0, lo_n = 0, hi_n = 0;
                    double t_new = 0, t_old = 0;
                    for (JsonVariant b : bgs) {
                      float v = b["sgv"].as<float>();
                      if (v <= 0) continue;
                      double t = b["datetime"].as<double>();
                      if (t > 0) { if (t_new == 0 || t > t_new) t_new = t;
                                   if (t_old == 0 || t < t_old) t_old = t; }
                      if (v < mn) mn = v;
                      if (v > mx) mx = v;
                      sum += v; n++;
                      if (v < id(n_low).state)       lo_n++;
                      else if (v > id(n_high).state) hi_n++;
                      else                           inr++;
                    }
                    if (n == 0) return false;
                    id(g_s_min)     = mn;
                    id(g_s_max)     = mx;
                    id(g_s_avg)     = sum / n;
                    id(g_s_tir)     = (int)(100.0f * inr  / n + 0.5f);
                    id(g_s_lowpct)  = (int)(100.0f * lo_n / n + 0.5f);
                    id(g_s_highpct) = (int)(100.0f * hi_n / n + 0.5f);
                    id(g_s_n)       = n;
                    id(g_s_hours)   = (t_new > t_old)
                                        ? (float)((t_new - t_old) / 3600000.0) : 0.0f;
                    id(g_s_have)    = true;
                    ESP_LOGI("cgm", "stats %d pts over %.1fh tir=%d%%",
                             n, id(g_s_hours), id(g_s_tir));
                    return true;
                  });

  - id: fetch_tx
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            std::string u = id(ns_url).state;
            while (!u.empty() && u.back() == '/') u.pop_back();
            u += "/api/v1/treatments.json?count=12";
            const std::string &tk = id(ns_token).state;
            if (!tk.empty())
              u += (u.find('?') == std::string::npos ? "?token=" : "&token=") + tk;
            return u;
          capture_response: true
          max_response_buffer_size: 24576
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("cgm", "tx resp %d len=%d",
                           response->status_code, (int) body.length());
                  if (response->status_code != 200) return;
                  JsonDocument doc;
                  if (deserializeJson(doc, body)) {
                    ESP_LOGW("cgm", "treatment parse failed");
                    return;
                  }
                  JsonArray arr = doc.as<JsonArray>();
                  if (arr.isNull() || arr.size() == 0) return;

                  // ISO8601 -> epoch ms. Nightscout stamps treatments in UTC
                  // ("...Z"), which is what mills is too, so the two agree.
                  auto iso_ms = [](const char *z) -> int64_t {
                    if (!z || !*z) return 0;
                    int Y = 0, Mo = 0, D = 0, h = 0, mi = 0, se = 0;
                    if (sscanf(z, "%d-%d-%dT%d:%d:%d",
                               &Y, &Mo, &D, &h, &mi, &se) < 6) return 0;
                    if (Mo < 1 || Mo > 12) return 0;
                    // days-from-civil (Howard Hinnant), no libc time needed
                    int y = Y - (Mo <= 2);
                    int era = (y >= 0 ? y : y - 399) / 400;
                    unsigned yoe = (unsigned)(y - era * 400);
                    unsigned doy = (153u * (Mo + (Mo > 2 ? -3 : 9)) + 2) / 5
                                   + (unsigned) D - 1;
                    unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
                    int64_t days = (int64_t) era * 146097 + (int64_t) doe - 719468;
                    return (days * 86400LL + h * 3600LL + mi * 60LL + se) * 1000LL;
                  };

                  // server "now" extrapolated from the last /pebble fetch, so
                  // treatment ages need no local clock either. Without it we
                  // have no clock at all and must not invent one.
                  int64_t srv = 0;
                  if (id(g_srv_now) > 0)
                    srv = (int64_t) id(g_srv_now)
                          + (int64_t)(millis() - id(g_srv_at));

                  std::vector<float> vc, vi, va;
                  float tc = 0, ti = 0;
                  for (JsonVariant t : arr) {
                    float c = t["carbs"].as<float>();
                    float u = t["insulin"].as<float>();
                    if (c <= 0 && u <= 0) continue;
                    // mills is a 64-bit epoch; read it as one. date and
                    // created_at are the fallbacks other uploaders write.
                    int64_t m = t["mills"].as<int64_t>();
                    if (m <= 0) m = t["date"].as<int64_t>();
                    if (m <= 0) m = iso_ms(t["created_at"] | "");
                    float age = -1.0f;                    // -1 == unknown
                    if (srv > 0 && m > 0) {
                      double a = (double)(srv - m) / 1000.0;
                      // a treatment older than 30d, or in the future, means a
                      // clock or field we do not understand - say so, never
                      // render a number that cannot be true
                      if (a >= -300.0 && a <= 2592000.0)
                        age = (float)(a < 0 ? 0 : a);
                    }
                    if (age >= 0 && age <= 86400.0f) { tc += c; ti += u; }
                    if (vc.size() < 3) {
                      vc.push_back(c); vi.push_back(u); va.push_back(age);
                      ESP_LOGI("cgm", "tx %.0fg %.2fU mills=%lld age=%.0fs",
                               c, u, (long long) m, age);
                    }
                  }
                  id(g_tx_c) = vc; id(g_tx_i) = vi; id(g_tx_age) = va;
                  id(g_tx_at) = millis();
                  id(g_tx_tot_c) = tc; id(g_tx_tot_i) = ti;
                  id(g_tx_have) = !vc.empty();
                  ESP_LOGI("cgm", "tx %d shown, 24h %.0fg %.2fU",
                           (int) vc.size(), tc, ti);

  - id: fetch_ages
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            std::string u = id(ns_url).state;
            while (!u.empty() && u.back() == '/') u.pop_back();
            // everything except boluses - pod, sensor and reservoir events
            // Ask for exactly the three event types, not "everything that is not
            // a bolus" - alarm Notes share that space and would crowd out a
            // sensor change that is a week old.
            // The API also silently defaults to a recent window, hence the
            // explicit date floor; a fixed old date needs no clock here.
            u += "/api/v1/treatments.json"
                 "?find%5BeventType%5D%5B$in%5D%5B%5D=Site%20Change"
                 "&find%5BeventType%5D%5B$in%5D%5B%5D=Sensor%20Start"
                 "&find%5BeventType%5D%5B$in%5D%5B%5D=Insulin%20Change"
                 "&find%5Bcreated_at%5D%5B$gte%5D=2020-01-01T00:00:00.000Z"
                 "&count=12";
            const std::string &tk = id(ns_token).state;
            if (!tk.empty())
              u += (u.find('?') == std::string::npos ? "?token=" : "&token=") + tk;
            return u;
          capture_response: true
          max_response_buffer_size: 16384
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("cgm", "ages resp %d len=%d",
                           response->status_code, (int) body.length());
                  if (response->status_code != 200) return;
                  JsonDocument doc;
                  if (deserializeJson(doc, body)) {
                    ESP_LOGW("cgm", "ages parse failed");
                    return;
                  }
                  JsonArray arr = doc.as<JsonArray>();
                  if (arr.isNull()) return;
                  int64_t srv = 0;
                  if (id(g_srv_now) > 0)
                    srv = (int64_t) id(g_srv_now)
                          + (int64_t)(millis() - id(g_srv_at));
                  if (srv <= 0) return;
                  // Nightscout only fills `mills` for treatments created with
                  // eventTime; ones written with created_at have neither mills
                  // nor date, so parse the ISO string as a last resort.
                  auto iso_ms = [](const char *z) -> int64_t {
                    if (!z || !*z) return 0;
                    int Y = 0, Mo = 0, D = 0, h = 0, mi = 0, se = 0;
                    if (sscanf(z, "%d-%d-%dT%d:%d:%d",
                               &Y, &Mo, &D, &h, &mi, &se) < 6) return 0;
                    if (Mo < 1 || Mo > 12) return 0;
                    int y = Y - (Mo <= 2);
                    int era = (y >= 0 ? y : y - 399) / 400;
                    unsigned yoe = (unsigned)(y - era * 400);
                    unsigned doy = (153u * (Mo + (Mo > 2 ? -3 : 9)) + 2) / 5
                                   + (unsigned) D - 1;
                    unsigned doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
                    int64_t days = (int64_t) era * 146097 + (int64_t) doe - 719468;
                    return (days * 86400LL + h * 3600LL + mi * 60LL + se) * 1000LL;
                  };
                  int64_t newest_c = 0, newest_s = 0, newest_i = 0;
                  for (JsonVariant t : arr) {
                    const char *et = t["eventType"] | "";
                    int64_t m = t["mills"].as<int64_t>();
                    if (m <= 0) m = t["date"].as<int64_t>();
                    if (m <= 0) m = iso_ms(t["created_at"] | "");
                    if (m <= 0) continue;
                    if (!strcmp(et, "Site Change")) { if (m > newest_c) newest_c = m; }
                    else if (!strcmp(et, "Sensor Start") ||
                             !strcmp(et, "Sensor Change")) { if (m > newest_s) newest_s = m; }
                    else if (!strcmp(et, "Insulin Change")) { if (m > newest_i) newest_i = m; }
                  }
                  auto age_of = [&](int64_t m) -> float {
                    if (m <= 0) return -1.0f;
                    double a = (double)(srv - m) / 1000.0;
                    // same sanity window as the treatment ages - never render
                    // a number that cannot be true
                    if (a < -300.0 || a > 2592000.0) return -1.0f;
                    return (float)(a < 0 ? 0 : a);
                  };
                  id(g_cage) = age_of(newest_c);
                  id(g_sage) = age_of(newest_s);
                  id(g_iage) = age_of(newest_i);
                  id(g_ages_at) = millis();
                  id(g_ages_have) = true;
                  ESP_LOGI("cgm", "ages pod=%.0fs sensor=%.0fs res=%.0fs",
                           id(g_cage), id(g_sage), id(g_iage));

