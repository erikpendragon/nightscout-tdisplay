# Builds the PUBLIC firmware - the credential-free images the device OTAs to.
#
# The whole point of building here rather than on a machine at home: this
# runner has no secrets.yaml, no OTA password and no API key. It cannot bake a
# credential into a published image, because there is none to bake. That is a
# structural guarantee rather than a procedural one, and it replaces the two
# ways this has gone wrong before - v1.0.1-1.0.8 were built from the config
# that flashes a real device and carried its OTA password, and "1.0.13" was
# built from a stale config and was actually 1.0.12.
#
# Nothing here publishes. A tag produces a DRAFT release for a human to look
# at; the update channel is only touched once that draft is published, by
# release-publish.yml.

name: Build release firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      esphome_version:
        description: "ESPHome version to build with"
        required: false
        default: "latest"

permissions:
  contents: write        # create the draft release. Nothing else.

env:
  # Pinned so the compile and the credential audit below run the SAME esphome.
  # A skew between them is exactly where a guard stops proving anything.
  ESPHOME_VERSION: ${{ inputs.esphome_version || 'latest' }}
  # One place, used by BOTH the compile and the audit below. If they disagree,
  # the audited config is not the compiled config and the guard proves nothing.
  LOCAL_BUILD: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Not shallow: a default fetch brings the tag REF but not the
          # annotated tag OBJECT, so %(contents:subject) comes back empty and
          # the release silently falls back to the last commit subject. That
          # produced the title "1.0.16 - Move upload-artifact to v7".
          fetch-depth: 0

      # The tag and the config must agree on the version. This is the guard
      # that would have caught "1.0.13", which shipped 1.0.12 successfully and
      # silently. Skipped for a manual dry run, which has no tag.
      - name: Tag must match project.version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cfg=$(awk '/^  project:/{f=1} f&&/version:/{gsub(/[" ]/,"");sub(/version:/,"");print;exit}' cgm-display.yaml)
          tag="${GITHUB_REF_NAME#v}"
          echo "config=$cfg  tag=$tag"
          if [ "$cfg" != "$tag" ]; then
            echo "::error::tag v$tag does not match project.version $cfg - refusing to build"
            exit 1
          fi

      # web-ui.js is gitignored on purpose (230 KB of vendored upstream), so
      # it has to be rebuilt here or js_include has nothing to serve.
      - name: Build the web UI bundle
        run: ./build-webui.sh

      - name: Compile
        id: build
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: cgm-display.yaml
          version: ${{ env.ESPHOME_VERSION }}
          # Marks this as an official image, which is what allows a device to
          # install it over itself. The config defaults local_build to true, so
          # ONLY images built here are installable - a hand-built one checks
          # and notifies but refuses to overwrite its owner's compiled-in
          # device name, friendly name, encryption key and OTA password.
          #
          # If this line is ever dropped, official builds simply stop
          # self-installing. That is the harmless direction of the two.
          substitutions: |
            local_build=${{ env.LOCAL_BUILD }}

      # Belt and braces. The runner holds no secrets, so this should be
      # impossible to fail - which is the point: if it ever does fail,
      # something is badly wrong and publishing must stop.
      #
      # There is deliberately no .release-denylist here. That file holds real
      # secret values and is gitignored; putting it in CI would mean uploading
      # the very things we are trying to keep out. Absence of secrets beats
      # scanning for them.
      - name: Prove the build carried no credentials
        run: |
          docker run --rm -v "$PWD":/config -u "$(id -u):$(id -g)" \
            "ghcr.io/esphome/esphome:${ESPHOME_VERSION}" config cgm-display.yaml \
            -s local_build "${LOCAL_BUILD}" \
            > /tmp/resolved.yaml
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/resolved.yaml
          # Prove the marker actually took, rather than trusting that passing
          # it worked. An official image that quietly built as local would
          # refuse to install itself and nobody would know why.
          got=$(grep -m1 -E '^  local_build:' /tmp/resolved.yaml | awk '{print $2}')
          echo "local_build in the compiled config: ${got}"
          if [ "$got" != "${LOCAL_BUILD}" ]; then
            echo "::error::local_build is '$got', expected '${LOCAL_BUILD}'"
            exit 1
          fi
          # grep -c and compare the count, never grep -q: under pipefail a -q
          # exits on first match, SIGPIPEs the producer, and a HIT reads as a
          # MISS. That bug shipped twice in make-release.sh.
          pw=$(grep -cE '^[[:space:]]+password:' /tmp/resolved.yaml || true)
          en=$(grep -cE '^[[:space:]]+encryption:' /tmp/resolved.yaml || true)
          echo "password lines: $pw   encryption lines: $en"
          if [ "$pw" != "0" ] || [ "$en" != "0" ]; then
            echo "::error::resolved config declares credentials - refusing to publish"
            exit 1
          fi

      - name: Assemble manifest and docs/
        env:
          BUILD_DIR: ${{ steps.build.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Locate the images rather than assuming their names. The action
          # appends the platform variant to BOTH the directory and the files
          # (cgm-display-esp32/cgm-display-esp32.ota.bin), and that naming is
          # the action's business, not ours - it has changed before and can
          # change again. Listing what was found makes any future break
          # diagnose itself from the log.
          echo "build dir: $BUILD_DIR"
          ls -l "$BUILD_DIR"
          ota=$(find "$BUILD_DIR" -name '*.ota.bin' | head -1)
          factory=$(find "$BUILD_DIR" -name '*.factory.bin' | head -1)
          echo "ota=$ota"
          echo "factory=$factory"
          if [ -z "$ota" ] || [ -z "$factory" ]; then
            echo "::error::could not find both images in $BUILD_DIR"
            exit 1
          fi
          # The summary is what the device shows next to an offered update,
          # so it has to describe the RELEASE, not whatever the last commit
          # happened to be - the dry run produced "Find the built images
          # instead of assuming their filenames", which is plumbing and means
          # nothing to someone holding the display.
          #
          # Prefer an annotated tag's own message; fall back to the commit
          # subject. The published manifest is regenerated by
          # release-publish.yml from the RELEASE TITLE, which is the value
          # that actually reaches devices - this one only labels the draft.
          # Ask GitHub for the tag's message rather than git. actions/checkout
          # fetches with --no-tags, so refs/tags/<tag> in the runner points
          # straight at the commit and the annotated tag OBJECT is absent -
          # %(contents:subject) is then empty and this silently fell back to
          # the commit subject twice, titling a release
          # "1.0.16 - Move upload-artifact to v7". The API has no such
          # ambiguity: it returns the tag object or it 404s.
          summary=""
          if [ -n "${GITHUB_REF_NAME:-}" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" -q '.object.sha' 2>/dev/null || true)
            if [ -n "$sha" ]; then
              summary=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" -q '.message' 2>/dev/null | head -1 || true)
            fi
          fi
          [ -n "$summary" ] || summary=$(git log -1 --pretty=%s)
          [ -n "$summary" ] || summary="Maintenance release"
          echo "summary: $summary"
          echo "RELEASE_SUMMARY=$summary" >> "$GITHUB_ENV"
          ./make-release.sh "$summary" "$ota" "$factory" /tmp/resolved.yaml

      # Always uploaded, tag or dry run. This is what you inspect.
      - name: Upload for inspection
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.build.outputs.project-version }}
          path: |
            docs/manifest.json
            docs/cgm-display.ota.bin
            docs/cgm-display.factory.bin
          retention-days: 30

      # DRAFT. Creates nothing anyone can download and does not touch the
      # update channel. Publishing it by hand is what makes it real.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "Built by CI from ${GITHUB_SHA}."
            echo
            echo "Credential-free: the resolved config declared no password and no encryption key."
            echo
            echo "Publishing this release updates the device update channel."
          } > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "$v - ${RELEASE_SUMMARY}" \
            --notes-file /tmp/notes.md \
            "docs/cgm-display.factory.bin#cgm-display.factory.bin (full image - flash a blank board)" \
            "docs/cgm-display.ota.bin#cgm-display.ota.bin (app only - for the device's own update)"
