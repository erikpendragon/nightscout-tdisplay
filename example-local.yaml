# Example local configuration - copy this to your ESPHome directory as
# cgm-display.yaml and edit to taste.
#
# The real configuration is pulled from GitHub by the packages block below,
# so this file only holds what is specific to YOUR installation. Nothing to
# keep in sync by hand, and `esphome clean` (or waiting for `refresh`) picks
# up a newer upstream config.
#
# Two support files must also sit in this directory. ESPHome resolves
# `includes:` and `js_include:` relative to the CONFIG directory, not the
# downloaded package, so the copies inside the package are not found:
#
#   version_compare.h   copy it from this repo
#   web-ui.js           generate it with ./build-webui.sh

packages:
  nightscout_tdisplay:
    url: https://github.com/erikpendragon/nightscout-tdisplay
    # `main` is the newest code, which may include work that has not been
    # released yet. `ref: v1.0.17` pins you to exactly what everyone else is
    # running, and you bump it when you choose to.
    ref: main
    files: [cgm-display.yaml]
    # ESPHome caches the download and re-fetches only when the copy is older
    # than this, so with `1d` a build minutes after an upstream change quietly
    # uses yesterday's copy and you get the old version with no error at all.
    # `always` costs a few seconds per build and removes that surprise.
    refresh: always

# ---------------------------------------------------------------------------
# SUBSTITUTIONS - the settings that are compiled in rather than stored on the
# device, so they are yours only for as long as you build the firmware.
#
# A substitution here overrides the project's. List only what you want to
# change; anything you leave out keeps the upstream value.
#
# Everything on the device's web page - Nightscout URL, token, thresholds,
# brightness, lifetimes - is stored on the device and needs nothing here.
# ---------------------------------------------------------------------------
# substitutions:
#   # Hostname and mDNS name: the board answers to kitchen-cgm.local. There is
#   # no runtime setter, so changing it means a rebuild and reflash - and Home
#   # Assistant treats the result as a NEW device, leaving the old entities
#   # behind as unavailable.
#   device_name: kitchen-cgm
#   friendly_name: Kitchen CGM
#
#   # Where THIS device looks for firmware updates. Point it at your own fork's
#   # channel if you publish your own builds. It is also a field on the web
#   # page, so you can change it later without a rebuild - this only sets the
#   # value a freshly flashed board starts with.
#   fw_manifest: "https://you.github.io/nightscout-tdisplay/manifest.json"
#
#   # mg/dL. The project defaults to mmol/L, and the threshold sliders need
#   # compile-time ranges, so switch the WHOLE block together - change the
#   # units alone and the sliders will not reach your numbers.
#   bg_units: "mg/dL"
#   th_step:  "1"
#   ul_init:  "55"   # urgent low
#   ul_min:   "40"
#   ul_max:   "110"
#   lo_init:  "70"   # low
#   lo_min:   "45"
#   lo_max:   "125"
#   hi_init:  "180"  # high
#   hi_min:   "110"
#   hi_max:   "290"
#   uh_init:  "250"  # urgent high
#   uh_min:   "145"
#   uh_max:   "450"
#
#   # Do NOT set local_build here. It defaults to true, and that is what stops
#   # a published image being installed over the top and discarding everything
#   # in this file. Only this project's CI sets it to false, because only a CI
#   # runner is guaranteed to hold no secrets.

# ---------------------------------------------------------------------------
# Everything below is OPTIONAL. Delete it and the device still works - it just
# has no OTA password and an unencrypted API, which is the published default.
#
# A note on how ESPHome merges packages, because the two blocks differ:
#   `ota:` is a LIST, and lists are APPENDED. Without `!extend` you would get
#          a second OTA platform rather than a password on the existing one.
#   `api:` is a MAPPING, and mappings are MERGED, so `encryption:` slots in
#          alongside the package's own settings with no `!extend`.
# ---------------------------------------------------------------------------

# Require a password to flash this board over the air.
#   esphome secrets: my_ota_password: "something long"
# ota:
#   - id: !extend ota_esphome
#     password: !secret my_ota_password

# Encrypt the Home Assistant connection. Generate a key with
# `openssl rand -base64 32`, put it in your secrets, and give the same key to
# Home Assistant when it asks. If HA already knows this device, use the key it
# already has or it will not reconnect.
# api:
#   encryption:
#     key: !secret my_api_key
